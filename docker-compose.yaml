services:
  database:
    build: ./database/
    container_name: 'db_home_library'
    ports:
      - '$POSTGRES_PORT:$POSTGRES_PORT'
    volumes:
      - db_storage_data:/var/lib/postresql/data
    restart: always
    network:
      - internal
    env_file:
      - .env
    command: ['postgres', '-c', 'port=$DB_PORT', '-c', 'log_statement=all']

  app:
    container_name: 'app'
    image: uladziby/nodejs2024q3-service-app
    ports:
      - '$PORT:$PORT'
    stdin_open: true
    volumes:
      - .:/app
    depends_on:
      - postgres-db
    command: npm run start:docker:dev
    restart: on-failure
    env_file:
      - .env
    networks:
      - app-db-network

networks:
  app-db-network:
    driver: bridge

volumes:
  dbdata:
